site_name: Synthetic Plastic Transformer
site_description: A materials discovery engine for replacing synthetic polymers with organic natural fibers
site_author: Your Name
site_url: https://yourusername.github.io/synthetic-plastic-transformer

repo_name: yourusername/synthetic-plastic-transformer
repo_url: https://github.com/yourusername/synthetic-plastic-transformer
edit_uri: ""

copyright: Copyright &copy; 2024 Your Name

theme:
  name: material
  language: en
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  font:
    text: Roboto
    code: Roboto Mono

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.prune
    - navigation.indexes
    - toc.follow
    - toc.integrate
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - header.autohide
    - content.code.annotate
    - content.code.copy
    - content.tooltips

  icon:
    repo: fontawesome/brands/github
    logo: material/leaf

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/synthetic-plastic-transformer
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/synthetic-plastic-transformer/
    - icon: fontawesome/brands/docker
      link: https://github.com/yourusername/synthetic-plastic-transformer/pkgs/container/synthetic-plastic-transformer

  version:
    provider: mike

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - git-revision-date-localized:
      enable_creation_date: true
      type: timeago
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            members_order: source
            show_root_heading: true
            show_source: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:materialx.emoji.to_svg
      emoji_index: !!python/name:materialx.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: yourusername
      repo: synthetic-plastic-transformer
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Architecture Decision Records:
    - ADR 0001 - GNN & Transfer Learning: adr/0001-gnn-and-transfer-learning-strategy.md
    - ADR 0002 - Multi-Objective Optimization: adr/0002-multi-objective-fiber-blend-optimization.md
    - ADR 0003 - GOTS Compliance Engine: adr/0003-gots-compliance-and-chemical-restriction-engine.md
    - ADR 0004 - Materials Database & Async Pipeline: adr/0004-materials-database-and-async-pipeline.md
  - Development:
    - Docker Environment: DOCKER_DEVELOPMENT.md
 